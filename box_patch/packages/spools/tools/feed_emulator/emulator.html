const SOURCES={"pair_logic.py": "# Finds whose tag is whose when two spools share one reader, and feeds them to the safe point.\n# Tag logic of a reader pair, run as is by tools/feed_emulator. It knows no hardware: tick() takes what the reader\n# sees and sets the wanted direction of each spool; the caller moves the motors.\nTURN = 630.\nREAD_NONE, READ_TAG, READ_COLLISION = \"none\", \"tag\", \"collision\"\n# How a tag was given to a spool, from the weakest evidence to the strongest.\nSURE_GUESS, SURE_LEFT, SURE_APPEARED, SURE_REREAD = 1, 2, 3, 4\nSURE_NAMES = {SURE_GUESS: \"guess\", SURE_LEFT: \"left with the turning spool\",\n              SURE_APPEARED: \"appeared while only it turned\", SURE_REREAD: \"reread\"}\n\n\nclass Spool:\n    def __init__(self, name):\n        self.name = name\n        self.pos = 0.\n        self.rot = 0.\n        self.dir = 0\n        self.moving = False  # the caller says whether the motor has really stopped\n        self.target = None  # where the run should end, for a caller that can stop exactly there\n        self.speed = 0.\n        self.tag = None\n        self.no_tag = False\n        self.out = False\n        self.out_said = False\n        self.inserted = False\n        self.inserted_at = None\n        self.started = False\n        self.clearing = False\n        self.waiting = False\n        self.paused = False\n        self.swing = 0\n        self.swing_paused = 0\n        self.swing_from = 0.\n        self.reread = 0\n        self.reread_base = 0.\n        self.at_antenna = False\n        self.sure = 0\n\n\nclass PairLogic:\n    def __init__(self, names, limit=1000., test=350., rock=20., rock_speed=30., speed=60.,\n                 swing=1.04, start_delay=2., watchdog=60., min_pos=60.):\n        self.spools = [Spool(name) for name in names]\n        self.limit, self.test, self.rock_length = limit, test, rock\n        self.rock_speed, self.speed, self.swing = rock_speed, speed, swing\n        self.start_delay, self.watchdog, self.min_pos = start_delay, watchdog, min_pos\n        self.now = 0.\n        self.phase = \"search\"\n        self.rock = 0\n        self.rock_base = 0.\n        self.tester = self.waiter = None\n        self.candidate = None\n        self.test_from = 0.\n        self.gone = 0\n        self.swapped = False\n        self.done = False\n        self.guard = False\n        self.progress = 0.\n        self.signature = None\n        self.last_none_at = -1.\n        self.reread_queue = []\n        self.last_kind = None  # no reading yet: a tag seen first is not known to have just come\n        self.log = []\n\n    def spool(self, name):\n        return next(s for s in self.spools if s.name == name)\n\n    def _say(self, text):\n        self.log.append(\"%.1f %s\" % (self.now, text))\n\n    def _run(self, spool, direction, speed=None, target=None):\n        spool.dir, spool.speed, spool.target = direction, speed or self.speed, target\n\n    def _halt(self, spool):\n        spool.dir, spool.speed, spool.target = 0, 0., None\n\n    def insert(self, name, now):\n        spool = self.spool(name)\n        if spool.inserted:\n            return\n        spool.inserted, spool.inserted_at = True, now\n        self.done = False\n        self.progress = now\n\n    def start_reread(self, name, now):\n        spool = self.spool(name)\n        if spool.dir or spool.reread or not spool.started:\n            return False\n        spool.reread, spool.reread_base = 1, spool.pos\n        spool.tag, spool.no_tag = None, False\n        self.done = self.guard = False\n        self.progress = now\n        self._run(spool, -1)\n        return True\n\n    def _put(self, spool, uid, sure=SURE_APPEARED, reread=False):\n        \"\"\"Write a tag to a spool with how sure the logic is about it. One tag cannot sit on\n        two spools: then only the less sure one is read again. A reread is the strongest\n        evidence, as only that spool turns: if it finds the same tag, the other spool is\n        the doubtful one and is read again next.\"\"\"\n        other = self._other(spool)\n        if other.tag == uid:\n            if reread or sure > other.sure:\n                self._say(\"tag %s on both spools, reading %s again\" % (uid, other.name))\n                other.tag = None\n                self._queue_reread(other)\n            else:\n                self._say(\"tag %s on both spools, reading %s again\" % (uid, spool.name))\n                self._queue_reread(spool)\n                return\n        spool.tag, spool.sure = uid, sure\n        self._say(\"tag %s is %s (%s)\" % (uid, spool.name, SURE_NAMES[sure]))\n\n    def _queue_reread(self, spool):\n        if spool.name not in self.reread_queue:\n            self.reread_queue.append(spool.name)\n        self.done = False\n\n    def _other(self, spool):\n        return self.spools[1] if spool is self.spools[0] else self.spools[0]\n\n    def _owner(self, uid):\n        return next((s for s in self.spools if s.tag == uid), None)\n\n    @staticmethod\n    def _open(spool):\n        return spool.started and not spool.tag and not spool.no_tag and not spool.out\n\n    def _tick_reread(self, spool, kind, uid):\n        other, base = self._other(spool), spool.reread_base\n        if other.dir > 0:\n            self._halt(other)\n        if spool.out:\n            spool.reread = 0\n            self._say(\"reread %s: filament left\" % (spool.name,))\n            self.done = not self.reread_queue\n            return\n        if kind == READ_COLLISION and other.tag and other.at_antenna:\n            self._run(other, 1)\n            return\n        if kind == READ_TAG and (not self._owner(uid) or self._owner(uid) is other):\n            self._put(spool, uid, SURE_REREAD, reread=True)\n            spool.no_tag = False\n            spool.reread = 3\n        half = TURN * 0.52\n        if spool.reread == 1 and (spool.pos <= base - half or spool.pos <= self.min_pos):\n            spool.reread = 2\n            self._run(spool, 1)\n        elif spool.reread == 2 and spool.pos >= base:\n            spool.reread = 4\n            self._run(spool, 1)\n        elif spool.reread == 4 and spool.pos >= base + half:\n            spool.reread = 5\n            self._run(spool, -1, target=base)\n        elif spool.reread == 5 and spool.pos <= base:\n            self._halt(spool)\n            spool.reread = 0\n            if not spool.tag:\n                spool.no_tag = True\n                self._say(\"reread %s: no tag\" % (spool.name,))\n            self.done = not self.reread_queue\n        elif spool.reread == 3:\n            if spool.pos > base and spool.dir >= 0:\n                self._run(spool, -1, target=base)\n            elif spool.pos < base and spool.dir <= 0:\n                self._run(spool, 1, target=base)\n            if abs(spool.pos - base) < 15.:\n                self._halt(spool)\n                spool.reread = 0\n                self.done = not self.reread_queue\n\n    def tick(self, now, kind, uid=None):\n        if self.reread_queue and not any(s.reread for s in self.spools):\n            name = self.reread_queue[0]\n            spool = self.spool(name)\n            if not spool.dir and not spool.moving and spool.started and self.phase == \"search\" \\\n                    and not self._other(spool).moving:\n                self.reread_queue.pop(0)\n                self.start_reread(name, now)\n        self._tick(now, kind, uid)\n        self.last_kind = kind\n        if kind == READ_NONE:\n            self.last_none_at = now\n\n    def _tick(self, now, kind, uid=None):\n        self.now = now\n        both = self.spools\n        for s in both:\n            if s.inserted and not s.started and now - s.inserted_at >= self.start_delay:\n                s.started = True\n        busy = next((s for s in both if s.reread), None)\n        if busy is not None:\n            self._tick_reread(busy, kind, uid)\n            return\n        for s in both:\n            if s.out and not s.out_said:\n                s.out_said = True\n                s.swing, s.clearing, s.waiting = 0, False, False\n                self._say(\"filament of %s left the sensor\" % (s.name,))\n                for o in both:\n                    o.waiting = False\n                if self.phase != \"search\":\n                    self.phase, self.rock = \"search\", 0\n        active = any(s.started and (s.dir or s.waiting or s.swing or self._open(s)) for s in both)\n        if active and now - self.progress > self.watchdog and not self.guard:\n            self.guard = self.done = True\n            self._say(\"no progress, stopped\")\n            for s in both:\n                self._halt(s)\n            return\n        signature = (tuple((round(s.pos / 50.), s.tag, s.no_tag, s.out, s.swing) for s in both), self.phase)\n        if signature != self.signature:\n            self.signature, self.progress = signature, now\n        for s in both:\n            if s.started and s.dir > 0 and s.pos >= self.limit and not s.swing and not s.clearing \\\n                    and not (s.tag and s.at_antenna):\n                self._halt(s)\n            if s.swing and s.tag:\n                s.swing = 0\n                self._halt(s)\n            if s.clearing and not s.at_antenna:\n                s.clearing = False\n                self._halt(s)\n        if kind == READ_COLLISION:\n            for s in both:\n                if s.tag and s.at_antenna and not s.clearing:\n                    s.clearing = True\n                    self._run(s, 1)\n                    other = self._other(s)\n                    if self._open(other) and other.dir > 0:\n                        self._halt(other)\n                        other.paused = True\n        for s in both:\n            if s.paused and kind != READ_COLLISION:\n                s.paused = False\n                if kind == READ_TAG and not self._owner(uid) and not s.tag:\n                    self._put(s, uid, SURE_LEFT)\n        if self.phase == \"search\" and self._tick_search(kind, uid):\n            return\n        if self.phase == \"rock\":\n            self._tick_rock(kind, uid)\n        elif self.phase == \"test\":\n            if self._tick_test(kind, uid):\n                return\n        if self.phase == \"split\" and not self.tester.moving and self._tick_split(kind, uid):\n            return\n        self._tick_run_all()\n\n    def _tick_search(self, kind, uid):\n        both = self.spools\n        for s in both:\n            if s.swing_paused:\n                if not s.tag and not s.out:\n                    s.swing = s.swing_paused\n                    self._halt(s)\n                s.swing_paused = 0\n        if kind == READ_TAG and self._owner(uid) and self.last_kind == READ_NONE:\n            # A settled tag that comes out of an empty antenna while only the other spool\n            # turns belongs to that other spool.\n            owner = self._owner(uid)\n            other = self._other(owner)\n            if not owner.dir and not owner.moving and other.dir and not other.tag:\n                self._say(\"tag %s is really on %s\" % (uid, other.name))\n                owner.tag, other.tag = None, uid\n        moving = [s for s in both if self._open(s) and not s.waiting]\n        if len(moving) == 2 and (kind == READ_COLLISION or (kind == READ_TAG and not self._owner(uid))):\n            for s in both:\n                if s.swing:\n                    s.swing_paused, s.swing = s.swing, 0\n                    self._halt(s)\n            tester = both[0] if both[0].pos <= both[1].pos else both[1]\n            self.tester, self.waiter = tester, self._other(tester)\n            self._halt(self.waiter)\n            self.waiter.waiting = True\n            self.phase, self.rock = \"rock\", 1\n            self.candidate = uid if kind == READ_TAG else None\n            self.swapped = False\n            return True\n        if len(moving) == 1 and kind == READ_TAG and not self._owner(uid):\n            other = self._other(moving[0])\n            # A spool is put in place before its filament reaches the sensor, so one inserted\n            # before the antenna was last seen empty had no tag there then.\n            came = self.last_kind == READ_NONE and not other.dir and not other.moving and (\n                not other.inserted or other.inserted_at < self.last_none_at)\n            if other.inserted and not other.tag and not other.no_tag and not other.out and not came:\n                # The other spool stands but is new: its tag may be the one at the antenna.\n                self.tester, self.waiter = moving[0], other\n                other.waiting = True\n                self.phase, self.rock, self.gone = \"test\", 0, 0\n                self.candidate, self.swapped = uid, False\n                self.test_from = moving[0].rot\n                return True\n            self._put(moving[0], uid)\n            for s in both:\n                if s.waiting and not s.tag:\n                    s.waiting = False\n            return True\n        for s in both:\n            if self._open(s) and s.pos >= self.limit and not s.dir and not s.moving and not s.swing and not s.waiting:\n                s.swing, s.swing_from = 1, s.pos\n                self._run(s, -1)\n        for s in both:\n            if s.swing and not s.dir and not s.moving and not s.waiting:\n                self._run(s, -1 if s.swing == 1 else 1)\n        for s in both:\n            if s.swing == 1 and (s.pos <= s.swing_from - TURN * self.swing or s.pos <= self.min_pos):\n                s.swing = 2\n                self._run(s, 1)\n            elif s.swing == 2 and s.pos >= s.swing_from:\n                self._halt(s)\n                s.swing = 0\n                if not s.tag:\n                    s.no_tag = True\n                    self._say(\"%s: no tag\" % (s.name,))\n                for o in both:\n                    o.waiting = False\n        return False\n\n    def _tick_rock(self, kind, uid):\n        waiter = self.waiter\n        if self.rock == 1 and not waiter.dir and not waiter.moving and waiter.pos < self.min_pos + self.rock_length:\n            # Too close to the slot sensor: going back could pull the filament out of the gear.\n            self.rock = 4\n        elif self.rock == 1 and not waiter.dir and not waiter.moving:\n            self.rock_base = waiter.pos\n            self._run(waiter, -1, self.rock_speed)\n            self.rock = 2\n        elif self.rock == 2 and waiter.pos <= self.rock_base - self.rock_length:\n            self._run(waiter, 1, self.rock_speed)\n            self.rock = 3\n        elif self.rock == 3 and (waiter.pos >= self.rock_base or not waiter.dir):\n            self._halt(waiter)\n            self.rock = 4\n        elif self.rock == 4 and not waiter.moving:\n            # The decision is only valid once the stopped spool has really stopped.\n            self.rock = 0\n            self.phase = \"test\"\n            self.test_from = self.tester.rot\n            self.gone = 0\n            self.candidate = uid if kind == READ_TAG else None\n\n    def _tick_test(self, kind, uid):\n        tester, waiter = self.tester, self.waiter\n        if kind == READ_COLLISION and self.candidate:\n            self._halt(tester)\n            tester.waiting, waiter.waiting = True, False\n            self._run(waiter, 1)\n            self.phase = \"split\"\n            return True\n        rolled = tester.rot - self.test_from >= self.test\n        if kind == READ_TAG and not self._owner(uid):\n            self.candidate = uid\n        if kind == READ_NONE:\n            self.gone += 1\n            if self.gone >= 2:\n                if self.candidate:\n                    self._put(tester, self.candidate, SURE_LEFT)\n                    waiter.waiting = False\n                self.phase = \"search\"\n                return True\n        else:\n            self.gone = 0\n        if rolled and kind == READ_TAG:\n            self._put(waiter, uid, SURE_LEFT)\n            waiter.clearing, waiter.waiting = True, False\n            self._run(waiter, 1)\n            self.phase = \"search\"\n            return True\n        if tester.pos >= self.limit and not tester.dir and not tester.moving and kind != READ_NONE and not rolled:\n            if self.swapped:\n                waiter.waiting = False\n                self.phase = \"search\"\n                return True\n            self.swapped = True\n            self.tester, self.waiter = waiter, tester\n            tester.waiting, waiter.waiting = True, False\n            self.test_from = waiter.rot\n        return False\n\n    def _tick_split(self, kind, uid):\n        tester, waiter = self.tester, self.waiter\n        if waiter.pos >= self.limit and not waiter.dir and not waiter.moving and kind != READ_NONE:\n            # The spool that was to take its tag away has no length left. Nothing is decided:\n            # both go back to the search, where the swing at the limit finds each tag alone.\n            tester.waiting = waiter.waiting = False\n            self.phase = \"search\"\n            return True\n        if kind == READ_TAG and not self._owner(uid) and uid != self.candidate:\n            self._put(tester, uid, SURE_GUESS)\n            self._put(waiter, self.candidate, SURE_GUESS)\n        elif kind == READ_TAG and uid == self.candidate:\n            self._put(waiter, self.candidate, SURE_GUESS)\n        elif kind == READ_NONE:\n            if self.candidate:\n                self._put(waiter, self.candidate, SURE_GUESS)\n        else:\n            return False\n        tester.waiting = False\n        self.phase = \"search\"\n        return True\n\n    def _tick_run_all(self):\n        both = self.spools\n        for s in both:\n            if s.out:\n                continue\n            other = self._other(s)\n            hold = s.tag and not s.at_antenna and (self._open(other) or (other.inserted and not other.started))\n            if s.started and not s.dir and not s.moving and not s.waiting and not s.swing and not s.paused \\\n                    and s.pos < self.limit and not hold:\n                self._run(s, 1)\n            if hold and s.dir > 0 and not s.clearing:\n                self._halt(s)\n        inserted = [s for s in both if s.inserted]\n        if inserted and self.phase == \"search\" and not self.done and all(\n                s.started and (s.out or (s.pos >= self.limit and not s.dir and not s.moving and (s.tag or s.no_tag)))\n                for s in inserted):\n            self.done = True\n            self._say(\"ready\")\n\n\ndef note_reading(logic, kind, uid):\n    \"\"\"The printer learns that a settled tag stands at the antenna only from the reader: it reads\n    that tag, or two tags at once while that tag was there a moment ago.\"\"\"\n    for spool in logic.spools:\n        if not spool.tag:\n            spool.at_antenna = False\n        elif kind == READ_TAG:\n            spool.at_antenna = uid == spool.tag\n        elif kind == READ_NONE:\n            spool.at_antenna = False\n        elif kind == READ_COLLISION and not spool.dir:\n            # A spool that stands keeps its tag where it was; a turning one may have moved it away.\n            pass\n", "test_pair_logic.py": "#!/usr/bin/env python3\n\"\"\"The same world as feed_emulator: spools with slack, one tag each, a stop that takes time.\"\"\"\nimport pathlib\nimport random\nimport sys\nimport unittest\n\n# The tested file is the one copied to the printer, in ../printer.\nsys.path.insert(0, str(pathlib.Path(__file__).resolve().parent.parent / \"printer\"))\n\nimport pair_logic as p\n\nZONE, POLL, STEP = 24., .2, .02\n\n\nclass World:\n    def __init__(self, a, b, delay=.3, slack=(0., 300.), slip=(0., 0.), has=(True, True), limit=1000., seed=0, test=350.):\n        rng = random.Random(seed)\n        self.logic = p.PairLogic((\"A\", \"B\"), limit=limit, test=test)\n        self.delay, self.t, self.next = delay, 0., 0.\n        self.state = {}\n        for name, angle, here in ((\"A\", a, has[0]), (\"B\", b, has[1])):\n            self.state[name] = dict(angle=float(angle), slack=rng.uniform(*slack), slip=rng.uniform(*slip),\n                                    real=40., has=here, v=0., stop=None, want=0.)\n\n    def step(self):\n        self.t += STEP\n        for spool in self.logic.spools:\n            st = self.state[spool.name]\n            want = spool.dir * spool.speed\n            # A stop or a turn takes effect late, as on the motors.\n            if want != st[\"want\"]:\n                st[\"want\"], st[\"stop\"] = want, self.t + self.delay if st[\"v\"] else self.t\n            if st[\"stop\"] is not None and self.t >= st[\"stop\"]:\n                st[\"v\"], st[\"stop\"] = st[\"want\"], None\n            d = st[\"v\"] * STEP\n            if not d:\n                continue\n            spool.pos += d\n            if d > 0:\n                g = min(st[\"slip\"], d)\n                st[\"slip\"] -= g\n                m = d - g\n                st[\"real\"] += m\n                u = min(st[\"slack\"], m)\n                st[\"slack\"] -= u\n                st[\"angle\"] += (m - u) / p.TURN * 360.\n                # The printer knows only the length fed, not how much of it turned the spool.\n                spool.rot += d\n            elif st[\"slip\"] <= 0:\n                st[\"real\"] += d\n                st[\"angle\"] += d / p.TURN * 360.\n                spool.rot += d\n                if st[\"real\"] <= 0:\n                    spool.out = True\n                    spool.dir, st[\"v\"], st[\"want\"] = 0, 0., 0.\n        for spool in self.logic.spools:\n            spool.moving = bool(self.state[spool.name][\"v\"])\n\n    @staticmethod\n    def _zone(st):\n        a = st[\"angle\"] % 360.\n        return st[\"has\"] and (a <= ZONE / 2 or a >= 360. - ZONE / 2)\n\n    def read(self):\n        seen = [s.name for s in self.logic.spools if s.inserted and self._zone(self.state[s.name])]\n        if len(seen) > 1:\n            return p.READ_COLLISION, None\n        if seen:\n            return p.READ_TAG, seen[0]\n        return p.READ_NONE, None\n\n    def tick(self):\n        if self.t >= self.next:\n            self.next = self.t + POLL\n            kind, uid = self.read()\n            p.note_reading(self.logic, kind, uid)\n            self.logic.tick(self.t, kind, uid)\n\n    def play(self, gap=0., order=\"AB\"):\n        logic = self.logic\n        logic.insert(order[0], 0.)\n        n = 0\n        while (not logic.done or not logic.spool(order[1]).inserted) and n < 40000:\n            n += 1\n            self.step()\n            if not logic.spool(order[1]).inserted and self.t >= gap:\n                logic.insert(order[1], self.t)\n            if not logic.done:\n                self.tick()\n        return n < 40000\n\n\nclass PairLogicTests(unittest.TestCase):\n    def sweep(self, step=30, **kwargs):\n        has = kwargs.get(\"has\", (True, True))\n        bad = []\n        for order in (\"AB\", \"BA\"):\n            for gap in (0., .5, 1., 3., 8., 30.):\n                for a in range(0, 360, step):\n                    for b in range(0, 360, step):\n                        world = World(a, b, seed=a * 1000 + b, **kwargs)\n                        finished = world.play(gap, order)\n                        got = (world.logic.spool(\"A\").tag, world.logic.spool(\"B\").tag)\n                        want = (\"A\" if has[0] else None, \"B\" if has[1] else None)\n                        if not finished or got != want or world.logic.guard:\n                            bad.append((a, b, gap, order, got))\n        return bad\n\n    def test_all_positions(self):\n        self.assertEqual(self.sweep(), [])\n\n    def test_long_stop_delay(self):\n        self.assertEqual(self.sweep(delay=.8), [])\n\n    def test_spool_without_a_tag(self):\n        self.assertEqual(self.sweep(has=(False, True)), [])\n\n    def test_no_tags_at_all(self):\n        self.assertEqual(self.sweep(has=(False, False)), [])\n\n    def test_spool_alone_is_decided_at_once(self):\n        world = World(350., 90.)\n        logic = world.logic\n        logic.insert(\"A\", 0.)\n        for _ in range(2000):\n            world.step()\n            if not logic.done:\n                world.tick()\n        self.assertEqual(logic.spool(\"A\").tag, \"A\")\n        self.assertTrue(logic.done)\n        self.assertFalse(logic.spool(\"B\").inserted)\n\n    def test_reread_finds_the_tag_and_returns(self):\n        world = World(350., 90.)\n        world.play(0.)\n        logic = world.logic\n        base = logic.spool(\"A\").pos\n        self.assertTrue(logic.start_reread(\"A\", world.t))\n        for _ in range(5000):\n            world.step()\n            if logic.done:\n                break\n            world.tick()\n        self.assertEqual(logic.spool(\"A\").tag, \"A\")\n        self.assertEqual(logic.spool(\"B\").tag, \"B\")\n        self.assertLess(abs(logic.spool(\"A\").pos - base), 40.)\n\n    def run_until_done(self, world):\n        logic = world.logic\n        for _ in range(30000):\n            world.step()\n            if logic.done:\n                break\n            world.tick()\n        return logic\n\n    def test_doubtful_spool_of_a_shared_tag_is_read_again(self):\n        world = World(350., 90.)\n        world.play(0.)\n        logic = world.logic\n        logic.spool(\"B\").sure = p.SURE_GUESS\n        logic.done = False\n        logic._put(logic.spool(\"B\"), \"A\", p.SURE_GUESS)\n        self.assertEqual(logic.reread_queue, [\"B\"])\n        self.assertEqual(logic.spool(\"A\").tag, \"A\")\n        self.run_until_done(world)\n        self.assertEqual((logic.spool(\"A\").tag, logic.spool(\"B\").tag), (\"A\", \"B\"))\n\n    def test_reread_finding_the_same_tag_moves_the_doubt_to_the_other(self):\n        world = World(350., 90.)\n        world.play(0.)\n        logic = world.logic\n        # A wrongly holds B's tag with      moving=s.moving, limit=w.logic.limit))\n    logs = [w.logic.log[-10:] for w in box]\n    phases = [w.logic.phase for w in box]\n    guards = [w.logic.guard for w in box]\n    return json.dumps(dict(slots=out, logs=logs, phases=phases, guards=guards))\n\ndef sweep(cfg, step):\n    c = json.loads(cfg)\n    runs = ok = wrong = miss = 0\n    bad = []\n    for order in (\"AB\", \"BA\"):\n        for gap in (0., .5, 1., 3., 8., 30.):\n            for a in range(0, 360, step):\n                for b in range(0, 360, step):\n                    w = T.World(a, b, delay=c[\"delay\"], slack=(c[\"slackMin\"], c[\"slackMax\"]),\n                                slip=(c[\"slipMin\"], c[\"slipMax\"]), limit=c[\"limit\"], seed=a * 1000 + b)\n                    finished = w.play(gap, order)\n                    got = (w.logic.spool(\"A\").tag, w.logic.spool(\"B\").tag)\n                    runs += 1\n                    if finished and got == (\"A\", \"B\") and not w.logic.guard:\n                        ok += 1\n                    else:\n                        if any(v is not None and v != n for v, n in zip(got, \"AB\")):\n                            wrong += 1\n                        else:\n                            miss += 1\n                        if len(bad) < 12:\n                            bad.append([a, b, gap, order])\n    return json.dumps(dict(runs=runs, ok=ok, wrong=wrong, miss=miss, bad=bad))\n", BUILT="2026-11-02 12:06";
const $=i=>document.getElementById(i),num=i=>+$(i).value,L=['1A','1B','1C','1D'],COL=['#7F77DD','#1D9E75','#D85A30','#D4537E'];
$('grid').innerHTML=L.map((l,i)=>`<div class="card"><svg width="100%" viewBox="0 0 120 120"><path d="M60 60L48 4A57 57 0 0 1 72 4Z" fill="#EF9F27" opacity=".25"/><circle cx="60" cy="60" r="50" fill="none" stroke="var(--line)"/><g id="g${i}"><circle id="m${i}" cx="60" cy="16" r="7" fill="${COL[i]}"/></g><text x="60" y="65" text-anchor="middle" fill="currentColor" font-size="14">${l}</text></svg><div id="s${i}" style="min-height:66px;font-size:13px"></div><label class="muted" style="font-size:13px">Положение <span id="v${i}"></span>°<input id="o${i}" type="range" min="0" max="359" value="${[358,20,180,90][i]}" style="width:100%"></label><label style="font-size:13px"><input type="checkbox" id="h${i}" checked> Есть метка</label><div><button id="i${i}">Вставить</button><button id="r${i}">Перечитать</button></div></div>`).join('');

function draw(){const S=JSON.parse(py.globals.get('state')());S.slots.forEach((s,i)=>{$('g'+i).setAttribute('transform',`rotate(${s.angle} 60 60)`);$('m'+i).style.display=s.has?'':'none';$('v'+i).textContent=$('o'+i).value;
const st=!s.inserted?'Не вставлена':s.out?'НИТЬ ВЫШЛА':s.moving?(s.dir<0?'НАЗАД':'Вперёд'):(s.pos>=s.limit&&(s.tag||s.noTag)?'Готова':'Стоит');
const tag=s.tag?(L[[0,1,2,3].find(j=>Math.floor(j/2)===Math.floor(i/2)&&'AB'[j%2]===s.tag)]):(s.noTag?'нет':'неизвестно');
$('s'+i).textContent=`${st}. Команда ${Math.round(s.pos)} мм, реально ${Math.round(s.real)} мм. Метка: ${tag}${s.sure?' ('+({'guess':'под вопросом','left with the turning spool':'ушла с катушкой','appeared while only it turned':'надёжно','reread':'перечитано'}[s.sure]||s.sure)+')':''}`});
S.logs.forEach((l,p)=>$('log'+p).textContent=l.join('\n'));
const rep=S.slots.filter(s=>s.inserted).map((s,k)=>{const i=S.slots.indexOf(s),own='AB'[i%2];if(s.out)return s.label+': нить вышла';if(s.tag&&s.tag!==own)return s.label+': ЧУЖАЯ МЕТКА';if(s.tag)return s.label+': метка верная'+(s.pos>=s.limit&&!s.moving?', готова':'');if(s.noTag)return s.label+(s.has?': МЕТКА НЕ НАЙДЕНА':': меток нет, верно');return s.label+': ищем'});
if(rep.length)$('res').textContent=rep.join(' · ')+(S.guards.some(x=>x)?' · СРАБОТАЛА ЗАЩИТА':'')}
