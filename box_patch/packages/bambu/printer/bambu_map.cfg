# Сопоставление меток Bambu с материалами и цветами QIDI.
# Редактируй в Fluidd и нажимай Save. Перезапуск не нужен:
# файл читается при каждом чтении метки Bambu, поэтому просто перечитай катушку.

[materials]
# Название с метки Bambu = код материала QIDI.
# Берётся самая длинная совпадающая часть названия: "PLA Silk+" подойдёт под "PLA Silk".
# Коды материалов есть в officiall_filas_list.cfg: номер секции [filaN] это код N.
# Можно указать и профиль QIDI Studio: PLA Matte = QFL30.
PLA Silk = 4
PLA Metal = 3
PLA Matte = 2
PLA Wood = 6
PLA-CF = 5
PLA Lite = 7
PLA Basic = 7
PLA = 7
PETG HF = 41
PETG-CF = 42
PETG Translucent = 45
PETG = 39
ABS-GF = 12
ABS = 11
ASA-CF = 20
ASA Aero = 19
ASA = 18
TPU = 50
PA6-CF = 25
PAHT-CF = 30
PA-CF = 25
PA = 24
PET-CF = 37
PC = 23
PVA = 47

[colors]
# Цвет на метке = цвет, который нужно показывать вместо него.
# Заполняй, только если цвет с метки выглядит неправильно. Цвет с метки виден
# в консоли после чтения: Bambu PLA Matte, #D3B7A7 -> ...
# Пример, убери решётку в начале строки, чтобы включить:
# D3B7A7 = C4A484
